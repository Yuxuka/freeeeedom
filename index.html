<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" 
href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="./pixel-borders.css">


<title>烙跑倒數💃🏻</title>

<style>
:root{
    --active-bg: #ffffff;
    --active-border: #d5d5d5;
    --past-bg: #f2f2f2;
    --past-text: #b7b7b7;

    --week-gap: 60px;
    --days-offset: -3px;
    --track-offset:-20px;
    --track-height: 18px;    
    --walker-top: calc(-4px - var(--walker-size));

    --hammock-width: 36px;
    --hammock-height: 72px;
    --sleep-width: 36px;
    --sleep-height: 72px;
    --hammock-top: -60px;
    --marker-top: -50px;
    --marker-gap: 28px;
    --stair-width: 60px;
    --stair-height: 70px;
}

body{
    margin: 30px;
    background: #fffdf9;
    font-family: "Huninn",sans-serif;
}

#countdownBox{
    position: sticky;
    top: 10px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5vw, 30px);
    width: fit-content;
    max-width: calc(100vw - 60px);
    box-sizing: border-box;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 70px;
    padding: 18px;
    background: #fff0f3;
    text-align: center;
    font-weight: bold;
    color: #8f5d5d;
}

.countdown-main{
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.3em;
}

.countdown-sub{
    margin-top: 6px;
    font-size: 0.45em;
    font-weight: normal;
    color: #a98282;
}

.normal-text{
    font-family: "Huninn", sans-serif;
}

.sparkles{
    height: 1.3em;
    vertical-align: middle;
}

.pleading{
    height: 1.5em;
    vertical-align: middle;
}

#dayNumber{
    font-family: "Press Start 2P", monospace;
    font-size: clamp(16px,5vw,28px);
}

.week{
    position: relative;
    margin-bottom: var(--week-gap);
    display: flex;
    justify-content: center;
}

.days{
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    top: var(--days-offset);
}

.days.reverse{
    flex-direction: row-reverse;
}

.zzz{
    height: clamp(36px,10vw,50px);
    aspect-ratio: 2.2;
    border-radius: 12px;
    display: flex;
    font-size: clamp(14px,5vw,20px) / 2;
    color: #694b4b;
    border-radius: 12px;
    justify-content: center;
    align-items: center;
    border: 3px solid #ffd34d;
    box-shadow:
        0 4px 0 rgba(0,0,0,.08),
        inset 0 2px 0 rgba(255,255,255,.9),
        0 0 12px rgba(255,211,77,.8),
        0 0 24px rgba(255,211,77,.4);
}

.day{
    z-index: 1;
    width: clamp(36px,10vw,50px);
    aspect-ratio: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(14px,5vw,20px);
    font-weight: bold;
    color: #694b4b;
    border-radius: 12px;
    border: 3px solid rgba(255,255,255,.8);
    box-shadow:  
        0 4px 0 rgba(0,0,0,.08), 
        inset 0 2px 0 rgba(255,255,255,.9);
    transition: .3s;
}

.day.past{
    transform: translateY(2px);
    box-shadow: none;
}

.day.past::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.6);
    border-radius:12px;
    z-index:1;
    pointer-events:none;
}

.day.today{
    border: 3px solid #ffd34d;
    box-shadow:
        0 4px 0 rgba(0,0,0,.08),
        inset 0 2px 0 rgba(255,255,255,.9),
        0 0 12px rgba(255,211,77,.8),
        0 0 24px rgba(255,211,77,.4);
}

.day.freedom{
    border: 3px solid #ff74b2;
}

.month-marker{
    z-index: 5;
    position: absolute;
    white-space: nowrap;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    color: #7b6f6f;
    text-align: center;
    top: var(--marker-top);
    opacity: 1;
    transition: opacity .3s;
    pointer-events: none;
    font-size: clamp(11px, 3vw, 15px);
}

@keyframes bounce{
    0%{transform: translateY(1px);}
    50%{transform: translateY(5px);}
    100%{transform: translateY(1px);}
}

.month-marker .arrow{
    font-size: clamp(14px,4vw,18px);
    animation: bounce 1s infinite ease-in-out;
}

.month-marker.past-month{
    opacity: .3;
}

.track{
    z-index: 10;
    image-rendering: pixelated;
    position: absolute;
    left: 0;
    top: var(--track-offset);
    height: var(--track-height);
    border-radius: 5px;
    overflow: hidden;
    background: transparent;
}

.track-completed{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    background-image:url(completed.png);
    background-repeat:repeat-x;
    background-size:auto 100%;
}

.track-current{
    position:absolute;
    top:0;
    left:0;
    width:72px;
    height:100%;
    display: none;
    background-image:url(current.png);
    background-repeat:no-repeat;
    background-size:100% 100%;
}

.walker{
    z-index: 40;
    image-rendering: pixelated;
    position: absolute;
    width: auto;
    height: auto;
    top: var(--walker-top);
    transition: .3s;
}

.walker.hidden{
    display: none;
}

.flag{
    z-index: 30;
    image-rendering: pixelated;
    position: absolute;
    top: -25px;
    right: 20px;
    width: 24px;
    height: 24px;
}

.hammock{
    z-index: 30;
    image-rendering: pixelated;
    position: absolute;
    width: var(--hammock-width);
    height: var(--hammock-height);
    top: var(--hammock-top);
}

.sleep{
    z-index: 30;
    image-rendering: : pixelated;
    position: absolute;
    width: var(--hammock-width);
    height: var(--hammock-height);
    top: var(--hammock-top);
}

.stair{
    z-index: 6;
    image-rendering: pixelated;
    position: absolute;
    width: var(--stair-width);
    height: var(--stair-height);
    bottom: calc(var(--stair-height) * -1);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    pointer-events: none;
}

.stair.stair-right{
    right: 20px;
}

.stair.stair-left{
    left: 20px;
}

</style>
</head>
<body>

<div id="countdownBox" class="pixel-borders pixel-borders--3a pixel-borders--inset pixel-borders--inset-all">
    <div class="countdown-main">
        <span class="normal-text">烙跑倒數</span>
        <span id="dayNumber">dayNumber</span>
        <span class="normal-text">天</span>
        <img class="sparkles" src="sparkles.png">
    </div>
    <div class="countdown-sub normal-text">
        （還有 <span id="calendarDayNumber">calendarDayNumber</span> 天！<img class="pleading" src="pleading-face.webp">）
    </div>
</div>

<div id="calendar"></div>

<script>
const START_DATE="2026-06-29";
const END_DATE="2026-09-06";
const ENABLE_WALKER=true;
const WALK_GIF_SMALL="walk_36px.gif";
const WALK_GIF_LARGE="walk_48px.gif";
const TRACK_IMAGE="";
const HAMMOCK_GIF="hammock.gif";
const STAIR_IMAGE="";
const WEEK_COLORS=["#ffbfd9","#ffe79a","#bff0b7","#bfeeff","#d8bdff"];
const LAST_WORKDAY = "2026-09-04";
const SLEEP_DATE_1 = "2026-09-05";
const SLEEP_DATE_2 = "2026-09-06";
const SLEEP_GIF = "hammock.gif";

const TRACK_CURRENT_WIDTH = 72;
const TRACK_CURRENT_HALF = TRACK_CURRENT_WIDTH / 2;
const MOBILE_BREAKPOINT = 480;

const calendar=document.getElementById("calendar");

const TAIPEI_OFFSET_MS = 8 * 60 * 60 * 1000;

function parseTaipeiDate(dateString){
    const [year, month, day] = dateString.split("-").map(Number);
    return new Date(Date.UTC(year, month - 1, day));
}

function getTaipeiDate(date){
    return date;
}

function formatDate(d){
    const y=d.getUTCFullYear();
    const m=String(d.getUTCMonth()+1).padStart(2,"0");
    const day=String(d.getUTCDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
}

function getRemainingWorkdays(startDate, endDate){
    let count = 0;
    const checkDate = new Date(startDate.getTime());
    const end = new Date(endDate.getTime());

    while(checkDate <= end){
        const day = checkDate.getUTCDay();
        if(day >= 1 && day <= 5){
            count++;
        }
        checkDate.setUTCDate(checkDate.getUTCDate()+1);
    }

    return count;
}

const dates=[];
let current=parseTaipeiDate(START_DATE);
const parsedEndDate=parseTaipeiDate(END_DATE);

while(current <= parsedEndDate){
    dates.push(new Date(current));
    current.setUTCDate(current.getUTCDate()+1);
}

const weeks=[];
let currentWeek=[];

dates.forEach(date=>{
    currentWeek.push(date);
    const taipei=getTaipeiDate(date);
    if(taipei.getUTCDay()===0){
        weeks.push(currentWeek);
        currentWeek=[];
    }
});

if(currentWeek.length){
    weeks.push(currentWeek);
}

const nowTaipei=new Date(Date.now() + TAIPEI_OFFSET_MS);
const actualToday=new Date(Date.UTC(
    nowTaipei.getUTCFullYear(),
    nowTaipei.getUTCMonth(),
    nowTaipei.getUTCDate()
));

const startDate=parseTaipeiDate(START_DATE);
const endDate=parseTaipeiDate(END_DATE);

const isFinished = actualToday > endDate;

const today = actualToday < startDate
    ? new Date(startDate)
    : isFinished
        ? new Date(endDate)
        : actualToday;

const lastWorkdayDate=parseTaipeiDate(LAST_WORKDAY);

const remainingCalendarDays=Math.max(
    0,
    Math.floor((endDate - today) / (1000 * 60 * 60 * 24))
);

const remainingWorkdays = isFinished
    ? 0
    : getRemainingWorkdays(
        today < startDate ? startDate : today,
        lastWorkdayDate
    );

document.getElementById("dayNumber").textContent = remainingWorkdays;
document.getElementById("calendarDayNumber").textContent = remainingCalendarDays;

let currentWeekIndex=-1;
let currentDayIndex=-1;

function updateTrackWidth(track,row){
    track.style.width=row.offsetWidth+"px";
    track.style.left=row.offsetLeft+"px";
}

weeks.forEach((week,weekIndex)=>{
    const weekColor=WEEK_COLORS[weekIndex % WEEK_COLORS.length];

    const wrapper=document.createElement("div");
    wrapper.className="week";

    const track=document.createElement("div");
    track.className="track";

    const trackCompleted=document.createElement("div");
    trackCompleted.className="track-completed";

    const trackCurrent=document.createElement("div");
    trackCurrent.className="track-current";

    track.appendChild(trackCompleted);
    track.appendChild(trackCurrent);

    if(TRACK_IMAGE){
        track.style.background=`url(${TRACK_IMAGE}) center/cover`;
    }

    const walker=document.createElement("img");
    walker.className="walker";

    const {size: walkerSize, src: walkerSrc} = getWalkerSize();
    walker.src = walkerSrc;
    walker.width = walkerSize;
    walker.height = walkerSize;

    const sleep=document.createElement("img");
    sleep.className = "sleep";
    sleep.style.display = "none";

    if(!ENABLE_WALKER){
        walker.classList.add("hidden");
    }

    wrapper.appendChild(walker);
    wrapper.appendChild(sleep);
    wrapper.appendChild(track);

    const row=document.createElement("div");
    row.className="days";
    if(weekIndex%2===1){
        row.classList.add("reverse");
    }

    week.forEach((date,index)=>{
        const taipei=getTaipeiDate(date);
        const dateZzz = formatDate(date);
        const day=document.createElement("div");
        day.className="day";
        day.style.background=weekColor;
        day.textContent=taipei.getUTCDate();

        if(dateZzz===SLEEP_DATE_1){
            const sleepZone = document.createElement("div");
            sleepZone.className = "zzz";
            sleepZone.textContent = "躺躺..zZ";
            sleepZone.style.background=weekColor;

            row.appendChild(sleepZone);
            return;
        }

        if(dateZzz===SLEEP_DATE_2){
            return;
        }

        if(taipei.getUTCDate()===1 || formatDate(date)===START_DATE){
            const marker=document.createElement("div");
            marker.className="month-marker";
            marker.innerHTML=`
                <div>${taipei.getUTCMonth()+1}月</div>
                <div class="arrow">▼</div>
            `;

            const markerMonth=taipei.getUTCMonth();
            const currentMonth=today.getUTCMonth();
            
            if(markerMonth < currentMonth){
                marker.classList.add("past-month");
            }

            day.appendChild(marker);
        }

        if(formatDate(date) < formatDate(today)){
            day.classList.add("past");
        }

        day.dataset.weekIndex=weekIndex;
        day.dataset.dayIndex=index;
        day.dataset.date=formatDate(date);

        if(formatDate(date)===formatDate(today)){
            day.classList.add("today");
            currentWeekIndex=weekIndex;
            currentDayIndex=index;
        }

        if(formatDate(date)===LAST_WORKDAY){
            day.classList.add("freedom");
            const flag=document.createElement("img");
            flag.className="flag";
            flag.src="flag.png";
            day.appendChild(flag);
        }

        row.appendChild(day);
        if(index < week.length-1){
            const gap=document.createElement("div");
            if(taipei.getUTCDay()===5){
                gap.style.width="20px";
            }
            else{
                gap.style.width="5px";
            }

            row.appendChild(gap);
        }
    });

    wrapper.appendChild(row);

    if(STAIR_IMAGE && weekIndex < weeks.length - 1){
        const stair = document.createElement("div");
        const isReverseWeek = weekIndex % 2 === 1;
        stair.className = "stair " + (isReverseWeek ? "stair-left" : "stair-right");
        stair.style.backgroundImage = `url(${STAIR_IMAGE})`;
        wrapper.appendChild(stair);
    }
    
    calendar.appendChild(wrapper);

    requestAnimationFrame(()=>{
        updateTrackWidth(track, row);
    });
});

function getCharacterMode(){
    const todayStr = formatDate(today);

    if(isFinished || todayStr === SLEEP_DATE_1 || todayStr === SLEEP_DATE_2){
        return "sleeping";
    }

    const day = nowTaipei.getUTCDay();
    const hour = nowTaipei.getUTCHours();
    const isRestWindow =
        (day===5 && hour>=18) ||
        day===6 ||
        day===0 ||
        (day===1 && hour<8);

    if(isRestWindow){
        return "resting";
    }

    return "walking";
}

function getWalkerSize(){
    return window.innerWidth < MOBILE_BREAKPOINT
        ? { size: 36, src: WALK_GIF_SMALL }
        : { size: 48, src: WALK_GIF_LARGE };
}

function applyWalkerSize(){
    const { size, src } = getWalkerSize();
    document.documentElement.style.setProperty("--walker-size", `${size}px`);

    document.querySelectorAll(".walker").forEach(walker=>{
        walker.width = size;
        walker.height = size;
        if(walker.getAttribute("src") !== src){
            walker.src = src;
        }
    });
}

applyWalkerSize();

function setTrackCurrentSpan(trackCompleted, trackCurrent, anchorLeft, width, rowWidth, isReverse){
    const clampedLeft = Math.max(0, Math.min(rowWidth - width, anchorLeft));
    const anchorRight = clampedLeft + width;

    trackCurrent.style.width = width + "px";

    if(!isReverse){
        trackCompleted.style.left = "0px";
        trackCompleted.style.right = "auto";
        trackCompleted.style.width = clampedLeft + "px";

        trackCurrent.style.left = clampedLeft + "px";
        trackCurrent.style.right = "auto";
    }else{
        trackCompleted.style.left = "auto";
        trackCompleted.style.right = "0px";
        trackCompleted.style.width = Math.max(0, rowWidth - anchorRight) + "px";

        trackCurrent.style.left = "auto";
        trackCurrent.style.right = Math.max(0, rowWidth - anchorRight) + "px";
    }
}

function renderAllTracks(){
    const allWeeks = document.querySelectorAll(".week");
    const isFinished = actualToday > endDate;

    allWeeks.forEach((weekEl, index)=>{
        const row = weekEl.querySelector(".days");
        const track = weekEl.querySelector(".track");

        track.style.display = "";
        updateTrackWidth(track, row);

        const trackCompleted=weekEl.querySelector(".track-completed");
        const trackCurrent=weekEl.querySelector(".track-current");

        if(isFinished){
            trackCompleted.style.left = "0";
            trackCompleted.style.right = "auto";
            trackCompleted.style.width = "100%";
            trackCurrent.style.display = "none";
            return;
        }

        if(index < currentWeekIndex){
            trackCompleted.style.left = "0";
            trackCompleted.style.right = "auto";
            trackCompleted.style.width = "100%";
            trackCurrent.style.display = "none";
        }else if(index > currentWeekIndex){
            track.style.display = "none";
        }
    });
     document.querySelectorAll(".hammock").forEach(el => el.remove());

     if(currentWeekIndex < 0){
        currentWeekIndex = weeks.length -1;
    }

    const week = allWeeks[currentWeekIndex];
    const row = week.querySelector(".days");
    const walker = week.querySelector(".walker");
    const trackCompleted = week.querySelector(".track-completed");
    const trackCurrent=week.querySelector(".track-current");

    if(!row || !walker){
        console.warn("renderAllTracks: 找不到 row / walker，略過本次渲染");
        return;
    }

    document.querySelectorAll(".walker").forEach(w=>{
        w.style.display = "none";
    });

    if(!ENABLE_WALKER) return;

    const rowRect=row.getBoundingClientRect();
    const weekRect=week.getBoundingClientRect();
    const isReverse=row.classList.contains("reverse");
    const mode=getCharacterMode();
    const {size: walkerSize, src: walkingSrc} = getWalkerSize();

    if(isFinished){
        document.querySelectorAll(".track-completed").forEach(track=>{
            track.style.left = "0";
            track.style.right = "auto";
            track.style.width = "100%";
        });
        document.querySelectorAll(".track-current").forEach(track=>{
            track.style.display = "none";
        });

        const sleep = week.querySelector(".sleep");
        const sleepZone = week.querySelector(".zzz");
        const rect = sleepZone.getBoundingClientRect();
        const center = rect.left + rect.width / 2;

        sleep.src = SLEEP_GIF || HAMMOCK_GIF;
        sleep.style.display = "block";
        walker.style.display = "none";

        sleep.style.left =
            (center - weekRect.left) - (walkerSize / 2) + "px";
        return;
    }

    trackCurrent.style.display = isFinished ? "none" : "block";

    if(mode === "sleeping" && SLEEP_GIF){
        const box1 = week.querySelector(`[data-date="${SLEEP_DATE_1}"]`);
        const box2 = week.querySelector(`[data-date="${SLEEP_DATE_2}"]`);
        const rect1 = box1.getBoundingClientRect();
        const rect2 = box2.getBoundingClientRect();
        const center1 = rect1.left + rect1.width / 2;
        const center2 = rect2.left + rect2.width / 2;
        const middleCenter = (center1 + center2) / 2;

        sleep.src = SLEEP_GIF || HAMMOCK_GIF;
        sleep.style.display = "block";
        if(SLEEP_GIF === HAMMOCK_GIF){
            sleep.style.width = getComputedStyle(document.documentElement).getPropertyValue("--hammock-width");
        }else{
            sleep.style.width = getComputedStyle(document.documentElement).getPropertyValue("--sleep-width");
        }

        sleep.style.left =
            (middleCenter - weekRect.left) - (walkerSize / 2) + "px";
        sleep.style.transform = "scaleX(1)";

        const boxCenterInRow = middleCenter - rowRect.left;

        setTrackCurrentSpan(
            trackCompleted,
            trackCurrent,
            boxCenterInRow - TRACK_CURRENT_HALF,
            TRACK_CURRENT_WIDTH,
            rowRect.width,
            isReverse
        );
        return;
    }

    const targetBox =
        week.querySelector(".day.today") ||
        week.querySelector(`[data-date="${SLEEP_DATE_2}"]`);

    if(!targetBox){
        console.warn("renderAllTracks: 找不到 targetBox，略過本次渲染");
        return;
    }

    const boxRect = targetBox.getBoundingClientRect();
    const boxCenterInRow = boxRect.left - rowRect.left + boxRect.width / 2;

    walker.src = walkingSrc;
    walker.style.display = "block";
    if(mode === "resting" && HAMMOCK_GIF){
        walker.style.display = "none";
    }
    walker.style.width = walkerSize + "px";
    walker.style.height = walkerSize + "px";
    walker.style.transform = isReverse ? "scaleX(-1)" : "scaleX(1)";

    const walkerLeftInWeek = boxRect.left - weekRect.left + boxRect.width/2 - walkerSize/2;
    walker.style.left = walkerLeftInWeek + "px";

    setTrackCurrentSpan(
        trackCompleted, trackCurrent,
        boxCenterInRow - TRACK_CURRENT_HALF, TRACK_CURRENT_WIDTH,
        rowRect.width, isReverse
    );

    if(mode === "resting" && HAMMOCK_GIF){
        const hammock = document.createElement("img");
        hammock.src = HAMMOCK_GIF;
        hammock.className = "hammock";
        const hammockWidth = 36;
        const hammockLeft = boxRect.left - weekRect.left + boxRect.width / 2 - hammockWidth / 2;
        hammock.style.left = hammockLeft + "px";
        hammock.style.transform = "none";
        week.appendChild(hammock);
    }
}

requestAnimationFrame(renderAllTracks);

let resizeTimer;
function handleResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
        applyWalkerSize();
        renderAllTracks();
    }, 150);
}

window.addEventListener("resize", handleResize);

</script>
 
</body>
</html>
